<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmanuel Adeyemi — Software Engineer</title>
<meta name="description" content="Emmanuel Adeyemi — software engineer at Mercor, building thoughtful software from Birmingham, UK.">
<meta property="og:title" content="Emmanuel Adeyemi — Software Engineer">
<meta property="og:description" content="Software engineer at Mercor, building thoughtful software from Birmingham, UK.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf9; --text:#1c1917; --muted:#78716c; --accent:#0d9488;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#0c0a09; --text:#e7e5e4; --muted:#a8a29e; --accent:#2dd4bf;}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  main{max-width:560px;margin:0 auto;padding:18vh 24px 64px}

  h1{font-size:clamp(28px,6vw,40px);font-weight:600;letter-spacing:-.03em}
  .role{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px}
  .intro{margin-top:40px;font-size:clamp(20px,4vw,27px);line-height:1.35;letter-spacing:-.02em}
  .intro .muted{display:block;margin-top:18px;color:var(--muted);font-size:16px;line-height:1.65;letter-spacing:0}
  .typewriter{color:var(--accent);white-space:nowrap}
  .typewriter::after{content:"";display:inline-block;width:2px;height:1em;margin-left:4px;background:currentColor;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .links{display:flex;flex-wrap:wrap;gap:20px;margin-top:40px;font-size:15px}
  .links a{text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
  .links a:hover{border-color:var(--accent);color:var(--accent)}

  footer{margin-top:18vh;font-family:var(--mono);font-size:12px;color:var(--muted)}
  @media(prefers-reduced-motion:reduce){
    .typewriter::after{animation:none}
  }
  @media(max-width:480px){
    main{padding-top:12vh}
    footer{margin-top:16vh}
  }
</style>
</head>
<body>
<main>

  <h1>Emmanuel Adeyemi</h1>
  <div class="role">software engineer at mercor · birmingham, uk</div>

  <div class="intro">
    <p>I build <span class="typewriter" id="typewriter">useful software</span>.</p>
    <span class="muted">I care about simple systems, clear interfaces, and work that makes a difference.</span>
  </div>

  <div class="links">
    <a href="mailto:segun9679@gmail.com">Email</a>
    <a href="https://github.com/segunemmanuel" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/segun-adeyemi/" target="_blank" rel="noopener">LinkedIn</a>
  </div>

  <footer>© <span id="y"></span> Emmanuel Adeyemi</footer>

</main>
<script>
  document.getElementById('y').textContent = new Date().getFullYear();

  const typewriter = document.getElementById('typewriter');
  const words = ['useful software', 'reliable systems', 'better tools'];
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let wordIndex = 0;

  if (!reducedMotion) {
    const pause = (duration) => new Promise((resolve) => setTimeout(resolve, duration));

    const typeNextWord = async () => {
      await pause(2200);
      for (let length = words[wordIndex].length; length >= 0; length -= 1) {
        typewriter.textContent = words[wordIndex].slice(0, length);
        await pause(45);
      }
      wordIndex = (wordIndex + 1) % words.length;
      for (let length = 1; length <= words[wordIndex].length; length += 1) {
        typewriter.textContent = words[wordIndex].slice(0, length);
        await pause(75);
      }
      typeNextWord();
    };

    typeNextWord();
  }
</script>
</body>
</html>
